<script>
/* boot guard - 화면이 안 그려질 때 흰 화면 대신 원인을 보여줍니다. */
(function () {
  var started = Date.now(), errs = [], settled = false;
  function el(id) { return document.getElementById(id); }
  function mounted() { var r = el('root'); return !!(r && r.firstChild); }

  function paint(title, note) {
    var f = el('boot-fallback'); if (!f) return;
    var local = location.protocol === 'file:';
    var steps = local
      ? '<li><b>index.html 하나만</b> 내려받으면 열리지 않습니다. 압축을 풀어 <code>index.html</code>과 <code>assets</code> 폴더를 같은 위치에 두고 다시 열어 주세요.</li>' +
        '<li>폴더 없이 파일 하나로 보고 싶으면 <b>jeju-single.html</b>을 여세요. 그 파일은 안에 모든 것이 들어 있습니다.</li>' +
        '<li>배포된 주소로 접속하는 경우에는 이 안내가 뜨지 않습니다.</li>'
      : '<li>페이지를 새로고침해 주세요. 일시적인 네트워크 오류일 수 있습니다.</li>' +
        '<li>계속 같으면 다른 네트워크나 다른 브라우저로 열어 보세요.</li>' +
        '<li>그래도 안 되면 아래 오류 내용을 그대로 보내 주세요.</li>';
    var h = '<h1>' + title + '</h1><p>' + note + '</p><ol>' + steps + '</ol>' +
      '<button type="button" onclick="location.reload()">다시 시도</button>';
    if (errs.length) h += '<pre>' + errs.join('\n\n').replace(/</g, '&lt;') + '</pre>';
    f.innerHTML = h;
  }

  function record(e) {
    var t = e && e.target;
    if (t && t.tagName && /^(SCRIPT|LINK|IMG)$/.test(t.tagName)) {
      errs.push('파일을 불러오지 못했습니다 → ' + (t.src || t.href || t.tagName));
    } else {
      var m = (e && (e.message || (e.error && e.error.message))) || '스크립트 오류';
      errs.push(m + (e && e.filename ? '  @' + e.lineno + ':' + e.colno : ''));
    }
    if (!mounted()) paint('일정표를 불러오지 못했습니다', (location.protocol==='file:'?'필요한 파일을 찾지 못했습니다.':'아래 순서로 확인해 주세요.'));
  }

  window.addEventListener('error', record, true);
  window.addEventListener('unhandledrejection', function (e) {
    errs.push('Promise: ' + ((e && e.reason && (e.reason.message || e.reason)) || '?'));
    if (!mounted()) paint('일정표를 불러오지 못했습니다', (location.protocol==='file:'?'필요한 파일을 찾지 못했습니다.':'아래 순서로 확인해 주세요.'));
  });

  var iv = setInterval(function () {
    if (mounted()) {
      if (!settled) { settled = true; var f = el('boot-fallback'); if (f && f.parentNode) f.parentNode.removeChild(f); }
      clearInterval(iv); return;
    }
    if (Date.now() - started > 8000) {
      clearInterval(iv);
      paint('일정표를 불러오지 못했습니다', errs.length ? (location.protocol==='file:'?'필요한 파일을 찾지 못했습니다.':'아래 순서로 확인해 주세요.') : '응답이 너무 느립니다.');
    }
  }, 120);
})();
</script>

  <script>
  /* Esc 로 팝업 닫기 — 메뉴가 펼쳐져 있으면 먼저 접습니다 */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape' && ev.keyCode !== 27) return;
    var panel = document.querySelector('.sheet-panel');
    if (!panel) return;
    var opened = panel.querySelector('.menu-wrap.open');
    if (opened) { opened.classList.remove('open'); ev.preventDefault(); return; }
    var btn = panel.querySelector('button.absolute.right-4.top-4');
    if (!btn) { var bs = panel.querySelectorAll('button'); btn = bs[bs.length - 1]; }
    if (btn) { btn.click(); ev.preventDefault(); }
  }, true);
